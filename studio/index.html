<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BEB studio</title>
<style>
  :root {
    --paper: #F7F5F0; --grid: #ECE8E0; --ink: #1C1C1E; --sub: #606068; --muted: #8E8E96;
    --red: #DE4A28; --navy: #1A365D; --amber: #FFAA3C; --line: #DCD8D0; --hl: #FFD65A;
    --b-top: #D6DAE2; --b-l: #96A0B2; --b-r: #BAC2D0; --win-off: #7C8496;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
    font-family: "Inter", "Noto Sans CJK JP", sans-serif; color: var(--ink); }
  #grid { position: absolute; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px; opacity: .8; }
  .layer { position: absolute; inset: 0; will-change: transform, opacity; }
  /* chrome */
  #logo { position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 14px; z-index: 20; }
  #logo b { width: 44px; height: 44px; border-radius: 10px; background: var(--red); color: #fff; display: grid; place-items: center;
    font: 900 28px Inter; }
  #logo span { font: 600 24px Inter; }
  #chapter { position: absolute; right: 60px; top: 44px; z-index: 20; background: var(--navy); color: #fff;
    border-radius: 20px; padding: 7px 20px; font: 700 22px Inter; letter-spacing: .06em; }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--red); z-index: 30; }
  /* subtitle band: English big, Japanese small, one sentence each */
  #subs { position: absolute; left: 260px; right: 260px; top: 900px; height: 140px; z-index: 25;
    background: rgba(255,255,255,.96); border: 2px solid var(--line); border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  #en { font: 600 46px Inter; line-height: 1.1; white-space: nowrap; }
  #jp { font: 500 31px "Noto Sans CJK JP"; color: var(--sub); white-space: nowrap; }
  .hl { background: var(--hl); color: var(--ink); border-radius: 8px; padding: 0 8px; }
  /* shared text styles */
  .num { font: 900 150px Inter; color: var(--red); letter-spacing: -.02em; line-height: 1; }
  .tag { display: inline-block; background: var(--navy); color: #fff; font: 800 34px Inter; border-radius: 30px; padding: 8px 28px; }
  .src { font: 500 24px Inter; color: var(--muted); }
  .h2 { font: 700 40px Inter; color: var(--ink); }
  .jpS { font: 500 24px "Noto Sans CJK JP"; color: var(--muted); }
  svg text { font-family: Inter, "Noto Sans CJK JP"; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="world" class="layer"></div>
  <div id="logo"><b>B</b><span>Business English Brief</span></div>
  <div id="chapter"></div>
  <div id="subs"><div id="en"></div><div id="jp"></div></div>
  <div id="progress"></div>
</div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>

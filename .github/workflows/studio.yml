name: Studio render

# Renders an HTML/SVG studio episode (studio/episodes/<slug>/<name>.json) with Azure English narration.
# The finished mp4 is pushed to the orphan branch `studio-media` (studio-media/<slug>/<name>.mp4). Uploads nothing.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "path, e.g. studio/episodes/ai-power/sample.json"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          for i in 1 2 3; do timeout 600 sudo apt-get update -qq -o Acquire::Retries=3 && timeout 900 sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg fonts-inter fonts-noto-cjk > /dev/null && break; done
          pip install -q playwright
          sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile
          python -m playwright install --with-deps chromium > /dev/null
      - name: Render
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          start=$(date +%s)
          python studio/render.py "${{ inputs.episode }}" --workers 4 --out out.mp4 2> err.txt || { cat err.txt; echo "::error title=studio::$(tail -c 900 err.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice title=studio::rendered in $(( $(date +%s) - start ))s, $(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4)s long"
      - name: Publish to studio-media branch
        run: |
          ep="${{ inputs.episode }}"; rel="${ep#studio/episodes/}"; dst="${rel%.json}.mp4"
          git fetch origin studio-media --depth 1 || true
          rm -rf /tmp/m && mkdir -p /tmp/m
          if git rev-parse -q --verify origin/studio-media >/dev/null; then git --work-tree=/tmp/m checkout origin/studio-media -- . ; fi
          mkdir -p "/tmp/m/$(dirname "$dst")" && cp out.mp4 "/tmp/m/$dst" && cp "${ep%.json}_timeline.json" "/tmp/m/${dst%.mp4}_timeline.json"
          cd /tmp/m && git init -q -b studio-media && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "studio: $dst"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" studio-media
          echo "::notice title=studio::pushed studio-media/$dst"

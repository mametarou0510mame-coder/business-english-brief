name: Competitors

# Read-only competitor scan (YouTube Data API search/channels/videos). Uploads nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python engine/competitors.py > out.txt 2>&1 || true
          split -l 40 out.txt part_ && for f in part_*; do echo "::notice title=comp::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done

name: Studio publish

# Daily publishing of studio episodes (owner rule 2026-11-24): one of each per day, in studio/queue.json order.
#   07:00 JST long video (YouTube, public)  ·  12:00 JST YouTube short + Instagram reel  ·  21:00 JST Instagram carousel
on:
  schedule:
    - cron: "4 22 * * *"   # 07:04 JST
    - cron: "4 3 * * *"    # 12:04 JST
    - cron: "4 12 * * *"   # 21:04 JST
  workflow_dispatch:
    inputs:
      what:
        description: "long | short | reel | carousel (comma-separated)"
        required: true
      slug:
        description: "optional: a specific slug"
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: studio-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Decide what to post
        id: w
        run: |
          if [ -n "${{ inputs.what }}" ]; then w="${{ inputs.what }}";
          else h=$(TZ=Asia/Tokyo date +%H); if [ "$h" -lt 10 ]; then w=long; elif [ "$h" -lt 18 ]; then w=short,reel; else w=carousel; fi; fi
          echo "what=$w" >> "$GITHUB_OUTPUT"; echo "::notice title=publish::$w"
      - name: Get rendered media
        run: |
          git fetch origin studio-media --depth 1
          mkdir -p /tmp/sm && git archive origin/studio-media | tar -x -C /tmp/sm   # archive, not checkout: checkout --work-tree rewrote the index and broke "Save state"
      - name: Put Instagram media on GitHub Pages (media branch)
        if: contains(steps.w.outputs.what, 'reel') || contains(steps.w.outputs.what, 'carousel')
        run: |
          git fetch origin media --depth 1 || true
          rm -rf /tmp/media && mkdir -p /tmp/media
          if git rev-parse -q --verify origin/media >/dev/null; then git archive origin/media | tar -x -C /tmp/media ; fi
          for d in /tmp/sm/*/; do s=$(basename "$d"); mkdir -p /tmp/media/studio/$s
            [ -f "$d/short.mp4" ] && cp "$d/short.mp4" /tmp/media/studio/$s/ && [ -f "$d/short.jpg" ] && cp "$d/short.jpg" /tmp/media/studio/$s/
            [ -d "$d/carousel" ] && cp -r "$d/carousel" /tmp/media/studio/$s/; done
          cd /tmp/media && git init -q -b media && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "studio media $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media
      - name: Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          rc=0
          for w in $(echo "${{ steps.w.outputs.what }}" | tr ',' ' '); do
            slug_arg=""; [ -n "${{ inputs.slug }}" ] && slug_arg="--slug ${{ inputs.slug }}"
            python studio/publish.py --what $w $slug_arg --media /tmp/sm 2> err.txt || { cat err.txt; echo "::error title=publish $w::$(tail -c 700 err.txt | tr '\n' ' ')"; rc=1; }
          done
          exit $rc
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add studio/published.json 2>/dev/null && git commit -qm "studio: published state" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done || true
